# 注意：doc/spire-istio-poc-summary.md 原文使用 .PodMeta.ServiceAccountName，
# 但實際 CRD schema（spire-controller-manager pkg/spireentry/entries.go）
# ServiceAccountName 是 PodSpec 底下的欄位，正確寫法為 .PodSpec.ServiceAccountName。
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: istio-workloads
spec:
  spiffeIDTemplate: "spiffe://poc.internal/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      spiffe-managed: "true"
  namespaceSelector:
    matchExpressions:
      - key: spiffe-managed
        operator: In
        values: ["true"]

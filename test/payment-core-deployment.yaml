apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-core-sa
  namespace: istio-validation
---
apiVersion: v1
kind: Service
metadata:
  name: payment-core
  namespace: istio-validation
spec:
  selector:
    app: payment-core
  ports:
    - port: 80
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-core
  namespace: istio-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-core
  template:
    metadata:
      labels:
        app: payment-core
        spiffe-managed: "true"
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: payment-core-sa
      containers:
        - name: app
          image: kennethreitz/httpbin
          ports:
            - containerPort: 80

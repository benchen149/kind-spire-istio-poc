apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-gateway-sa
  namespace: istio-validation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: istio-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
        spiffe-managed: "true"
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: payment-gateway-sa
      containers:
        - name: app
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep infinity"]
